services:
  - type: web
    name: shopara
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    repo: https://github.com/mendyvictorjunior2-cpu/boutique-ceinture
    branch: main
    envVars:
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@shopara.sn
      - key: ADMIN_PASS
        sync: false
      - key: NUMERO_ABONNEMENT
        value: "772695341"
    healthCheckPath: /
